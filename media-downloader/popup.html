<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>音视频下载</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">▶</span>
          <div>
            <h1>音视频下载</h1>
            <p id="subtitle">嗅探当前页面加载的音视频</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="refresh" class="icon-button" type="button" title="重新检测" aria-label="重新检测">↻</button>
          <button id="clear" class="icon-button" type="button" title="清空列表" aria-label="清空列表">⌫</button>
        </div>
      </header>

      <section class="toolbar">
        <div class="filters" id="filters" role="tablist" aria-label="按类型筛选">
          <button class="chip is-active" type="button" data-filter="all" role="tab">全部<i id="count-all">0</i></button>
          <button class="chip" type="button" data-filter="audio" role="tab">音频<i id="count-audio">0</i></button>
          <button class="chip" type="button" data-filter="video" role="tab">视频<i id="count-video">0</i></button>
          <button class="chip" type="button" data-filter="stream" role="tab">流媒体<i id="count-stream">0</i></button>
        </div>
        <button id="download-all" class="ghost-button" type="button">全部下载</button>
      </section>

      <section id="meta" class="meta-card" hidden aria-label="平台信息与文案">
        <div class="meta-head">
          <span class="meta-platform" id="meta-platform"></span>
          <span class="meta-author" id="meta-author"></span>
          <button id="meta-copy" class="mini" type="button" title="复制文案" aria-label="复制文案">复制文案</button>
        </div>
        <p class="meta-caption" id="meta-caption"></p>
      </section>

      <section id="preview" class="preview" hidden aria-label="预览播放器">
        <div class="preview-head">
          <span class="preview-kind" id="preview-kind">预览</span>
          <span class="preview-title" id="preview-title"></span>
          <button id="preview-open" class="mini" type="button" title="在新标签页打开" aria-label="在新标签页打开">↗</button>
          <button id="preview-close" class="mini" type="button" title="关闭预览" aria-label="关闭预览">×</button>
        </div>
        <div id="preview-body" class="preview-body"></div>
      </section>

      <section class="results" aria-labelledby="results-heading">
        <div class="section-heading">
          <h2 id="results-heading">检测到的资源</h2>
          <span id="count" class="count">—</span>
        </div>
        <div id="list" class="list" aria-live="polite"></div>
      </section>

      <footer class="footer">
        <div class="footer-row">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status" role="status" aria-live="polite">正在检测当前页面…</span>
        </div>
        <div id="progress" class="progress" hidden>
          <div class="progress-track"><i id="progress-fill"></i></div>
          <span id="progress-text" class="progress-text"></span>
        </div>
        <div class="footer-row options">
          <label class="option"><input type="checkbox" id="ask-save" /> 保存前询问位置</label>
          <label class="option"><input type="checkbox" id="show-segments" /> 显示流分片</label>
        </div>
      </footer>
    </main>

    <script src="media-types.js"></script>
    <script src="platforms.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
